name: CI

permissions:
  contents: read

# Runs on GitHub-hosted runners (`ubuntu-24.04`: 4 vCPU, 16 GB RAM, 6 h per job). No
# `pull_request` trigger: a fork's pull request would run with this repository's Actions cache in
# scope, and the cached `.lake` trees are the artifacts that the comparator workflow trusts.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'paper/**'
      - 'formalization.yaml'
      - 'CITATION.cff'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mathlib's oleans come from its public cache. Lake builds the Lattice-Probability modules this
  # library imports, at the commit pinned in `lake-manifest.json`, together with the library; both
  # build directories are cached.
  build:
    name: Build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # elan retries a failed toolchain download only once; this step retries the pinned release
      # asset with backoff and checks its SHA-256, so that the next step finds the toolchain
      # already installed.
      - name: Prefetch the pinned Lean toolchain with retries
        run: python3 scripts/prefetch_toolchain.py

      # Installs the toolchain named in `lean-toolchain`, fetches every package in
      # `lake-manifest.json` and downloads the Mathlib oleans.
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      # Restore and save are split so that the save runs even when a later step fails: an
      # interrupted build still banks its completed modules. The restore key has no sha, so it
      # matches the most recent entry with the same toolchain and manifest, which makes an
      # ordinary push incremental.
      - name: Restore build artifacts
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # The library is compiled with `warningAsError`, so a warning fails the build.
      - name: Build the library and enforce zero warnings
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          if grep -iE '(^|[[:space:]])warning: (\./)?(RandomSandpile|RandomSandpileAudit)(/|\.lean)|declaration uses .sorry|sorryAx' production-build.log; then
            echo "The production build must have zero warnings and no incomplete proofs."
            exit 1
          fi

      # `RandomSandpileAudit/Axioms.lean` prints the axioms of every numbered result of the paper,
      # through its theorems in `RandomSandpile/Assembly/Main.lean`. The check fails on any axiom
      # other than propext, Classical.choice and Quot.sound, on `sorryAx`, and on a missing,
      # unexpected or repeated report.
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake env lean RandomSandpileAudit/Axioms.lean 2>&1 | tee axioms-audit.log
          python3 scripts/check_axioms.py axioms-audit.log

      # The Mathlib-only comparator surface: each challenge elaborates with its one intentional
      # `sorry`, and each solution proves it from the library.
      - name: Build the comparator surface
        shell: bash
        run: |
          set -o pipefail
          lake build RandomSandpileAudit 2>&1 | tee audit-build.log

      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-logs-${{ github.sha }}
          path: |
            production-build.log
            axioms-audit.log
            audit-build.log
          if-no-files-found: warn

      - name: Save build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .lake/build
            .lake/packages/lattice-probability/.lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
